name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python-is-python3 \
          build-essential \
          git \
          ant \
          libssl-dev \
          libffi-dev \
          python3-dev \
          libltdl-dev \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libnss3-dev \
          libgdbm-dev \
          libnspr4-dev \
          unzip \
          zip

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Pre-cache Android NDK r25b
      run: |
        mkdir -p /home/runner/.buildozer/android/platform
        if [ ! -d "/home/runner/.buildozer/android/platform/android-ndk-r25b" ]; then
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /home/runner/.buildozer/android/platform/
        fi

    - name: Build APK with Buildozer
      run: |
        export P4A_NDK_VERSION="25b"
        buildozer android clean
        buildozer android debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
